# ─────────────────────────────────────────────────────────────────────────────
# HOPE2 ACADEMY — single-domain Nginx site
#
#   /                     -> static SPA (frontend production build)
#   /api/                 -> Node API server (reverse proxy)
#   /api/storage/objects/ -> uploaded media, served straight from local disk
#
# Frontend and API share ONE domain/origin, so the browser never makes a
# cross-origin request (no CORS needed).
#
# Install:  see DEPLOYMENT.md  (copy to /etc/nginx/sites-available, symlink into
# sites-enabled, `nginx -t`, then reload). Run 04-setup-ssl.sh afterwards —
# certbot will add the HTTPS (443) server block and the HTTP->HTTPS redirect.
# ─────────────────────────────────────────────────────────────────────────────

upstream hope2_api {
    # Must match PORT in deploy/.env.production.
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # ▼▼▼ REPLACE with your real domain(s) before installing ▼▼▼
    server_name your-domain.tld www.your-domain.tld;

    # Frontend production build is published here by 03-deploy-app.sh.
    root /var/www/hope2-academy;
    index index.html;

    # Allow uploads a little larger than the app's MAX_UPLOAD_BYTES (15 MB).
    client_max_body_size 20m;

    # Compress text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Uploaded media — served directly from disk for speed (no Node hop).
    # alias maps /api/storage/objects/<id>  ->  <UPLOAD_DIR>/<id>.
    # If you change UPLOAD_DIR in .env.production, change this path to match.
    # (New uploads always carry a file extension, so Nginx infers the MIME type.)
    location ^~ /api/storage/objects/ {
        alias /var/lib/hope2-academy/uploads/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public" always;
    }

    # Everything else under /api -> Node API server.
    location /api/ {
        proxy_pass http://hope2_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Hashed, content-addressed assets — safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback: any unknown path returns index.html so client-side
    # routing (react-router) can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
